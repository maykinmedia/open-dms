openapi: 3.0.3
info:
  title: Open DMS API
  version: 1.0.0
  description: |2

    Open DMS
  contact:
    email: standaarden.ondersteuning@vng.nl
    name: VNG
    url: https://zaakgerichtwerken.vng.cloud
  license:
    name: EUPL 1.2
    url: https://opensource.org/licenses/EUPL-1.2
paths:
  /api/v1/accounts/login:
    post:
      operationId: apiV1AccountsLoginCreate
      description: Authenticates the user, returns whoami details on successful login.
      summary: login
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Auth'
        required: true
      security:
      - AnonCSRFSession: []
      responses:
        '200':
          headers:
            API-version:
              schema:
                type: string
              description: 'Geeft een specifieke API-versie aan in de context van
                een specifieke aanroep. Voorbeeld: 1.2.1.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhoAmI'
          description: ''
        '400':
          headers:
            API-version:
              schema:
                type: string
              description: 'Geeft een specifieke API-versie aan in de context van
                een specifieke aanroep. Voorbeeld: 1.2.1.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidatieFout'
          description: ''
        '403':
          headers:
            API-version:
              schema:
                type: string
              description: 'Geeft een specifieke API-versie aan in de context van
                een specifieke aanroep. Voorbeeld: 1.2.1.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fout'
          description: ''
  /api/v1/accounts/logout:
    get:
      operationId: apiV1AccountsLogoutRetrieve
      description: Remove the authenticated user's ID from the request and flush their
        session data.
      summary: logout
      tags:
      - accounts
      security:
      - cookieAuth: []
      responses:
        '200':
          headers:
            API-version:
              schema:
                type: string
              description: 'Geeft een specifieke API-versie aan in de context van
                een specifieke aanroep. Voorbeeld: 1.2.1.'
          description: No response body
  /api/v1/accounts/whoami:
    get:
      operationId: apiV1AccountsWhoamiRetrieve
      description: Returns the current logged in user.
      summary: whoami
      tags:
      - accounts
      security:
      - cookieAuth: []
      responses:
        '200':
          headers:
            API-version:
              schema:
                type: string
              description: 'Geeft een specifieke API-versie aan in de context van
                een specifieke aanroep. Voorbeeld: 1.2.1.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhoAmI'
          description: ''
  /api/v1/search:
    post:
      operationId: search
      description: Search the document records.
      summary: Search
      tags:
      - search
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Search'
      security:
      - cookieAuth: []
      responses:
        '200':
          headers:
            API-version:
              schema:
                type: string
              description: 'Geeft een specifieke API-versie aan in de context van
                een specifieke aanroep. Voorbeeld: 1.2.1.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
          description: ''
  /api/v1/services:
    get:
      operationId: apiV1ServicesList
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: pageSize
        required: false
        in: query
        description: 'Het aantal resultaten terug te geven per pagina. (default: 100,
          maximum: 500).'
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          headers:
            API-version:
              schema:
                type: string
              description: 'Geeft een specifieke API-versie aan in de context van
                een specifieke aanroep. Voorbeeld: 1.2.1.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedServiceList'
          description: ''
  /api/v1/services/{serviceSlug}/zaaktypen:
    get:
      operationId: apiV1ServicesZaaktypenList
      description: Exposes Zaaktypen from /services/<zgw-service>/zaaktypen
      summary: zaaktypenList
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: pageSize
        required: false
        in: query
        description: 'Het aantal resultaten terug te geven per pagina. (default: 100,
          maximum: 500).'
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: A search term for the ZaakType service. The search is performed
          against the `identificatie__icontains` field.
      - in: path
        name: serviceSlug
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          headers:
            API-version:
              schema:
                type: string
              description: 'Geeft een specifieke API-versie aan in de context van
                een specifieke aanroep. Voorbeeld: 1.2.1.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedZaakTypeList'
          description: ''
  /api/v1/services/{serviceSlug}/zaaktypen/{zaaktypeUuid}:
    get:
      operationId: apiV1ServicesZaaktypenRetrieve
      description: Exposes Zaaktypen from /services/<zgw-service>/zaaktypen
      summary: zaaktypenRetrieve
      parameters:
      - in: path
        name: serviceSlug
        schema:
          type: string
        required: true
      - in: path
        name: zaaktypeUuid
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          headers:
            API-version:
              schema:
                type: string
              description: 'Geeft een specifieke API-versie aan in de context van
                een specifieke aanroep. Voorbeeld: 1.2.1.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZaakType'
          description: ''
  /api/v1/services/{serviceSlug}/zaaktypen/{zaaktypenZaaktypeUuid}/zaken:
    get:
      operationId: apiV1ServicesZaaktypenZakenList
      description: Exposes Zaak from /services/<zgw-service>/zaaktypen/<zaaktype>/zaken
      summary: zakenList
      parameters:
      - in: query
        name: einddatum__isnull
        schema:
          type: boolean
        description: De datum waarop de uitvoering van de zaak afgerond is.
      - in: query
        name: identificatie__icontains
        schema:
          type: string
        description: De unieke identificatie van de ZAAK (bevat de identificatie de
          gegeven waarden (hoofdletterongevoelig))
      - in: query
        name: omschrijving
        schema:
          type: string
        description: Een korte omschrijving van de ZAAK (bevat de omschrijving de
          gegeven waarden (hoofdletterongevoelig))
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: pageSize
        required: false
        in: query
        description: 'Het aantal resultaten terug te geven per pagina. (default: 100,
          maximum: 500).'
        schema:
          type: integer
      - in: path
        name: serviceSlug
        schema:
          type: string
        required: true
      - in: query
        name: startdatum__gte
        schema:
          type: string
          format: date
        description: De datum waarop met de uitvoering van de zaak is gestart
      - in: path
        name: zaaktypenZaaktypeUuid
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          headers:
            API-version:
              schema:
                type: string
              description: 'Geeft een specifieke API-versie aan in de context van
                een specifieke aanroep. Voorbeeld: 1.2.1.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedZaakList'
          description: ''
  /api/v1/services/{serviceSlug}/zaaktypen/{zaaktypenZaaktypeUuid}/zaken/{zaakUuid}:
    get:
      operationId: apiV1ServicesZaaktypenZakenRetrieve
      description: Exposes Zaak from /services/<zgw-service>/zaaktypen/<zaaktype>/zaken
      summary: zakenRetrieve
      parameters:
      - in: path
        name: serviceSlug
        schema:
          type: string
        required: true
      - in: path
        name: zaakUuid
        schema:
          type: string
        required: true
      - in: path
        name: zaaktypenZaaktypeUuid
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          headers:
            API-version:
              schema:
                type: string
              description: 'Geeft een specifieke API-versie aan in de context van
                een specifieke aanroep. Voorbeeld: 1.2.1.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Zaak'
          description: ''
  /api/v1/services/{serviceSlug}/zaaktypen/{zaaktypenZaaktypeUuid}/zaken/{zakenZaakUuid}/documents:
    get:
      operationId: apiV1ServicesZaaktypenZakenDocumentsList
      description: Exposes Documents from /services/<zgw-service>/zaaktypen/<zaaktype>/zaken/<zaak>/documents
      summary: documentsList
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: pageSize
        required: false
        in: query
        description: 'Het aantal resultaten terug te geven per pagina. (default: 100,
          maximum: 500).'
        schema:
          type: integer
      - in: path
        name: serviceSlug
        schema:
          type: string
        required: true
      - in: path
        name: zaaktypenZaaktypeUuid
        schema:
          type: string
        required: true
      - in: path
        name: zakenZaakUuid
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          headers:
            API-version:
              schema:
                type: string
              description: 'Geeft een specifieke API-versie aan in de context van
                een specifieke aanroep. Voorbeeld: 1.2.1.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDocumentList'
          description: ''
  /api/v1/services/{serviceSlug}/zaaktypen/{zaaktypenZaaktypeUuid}/zaken/{zakenZaakUuid}/documents/{documentUuid}:
    get:
      operationId: apiV1ServicesZaaktypenZakenDocumentsRetrieve
      description: Exposes Documents from /services/<zgw-service>/zaaktypen/<zaaktype>/zaken/<zaak>/documents
      summary: documentsRetrieve
      parameters:
      - in: path
        name: documentUuid
        schema:
          type: string
        required: true
      - in: path
        name: serviceSlug
        schema:
          type: string
        required: true
      - in: path
        name: zaaktypenZaaktypeUuid
        schema:
          type: string
        required: true
      - in: path
        name: zakenZaakUuid
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          headers:
            API-version:
              schema:
                type: string
              description: 'Geeft een specifieke API-versie aan in de context van
                een specifieke aanroep. Voorbeeld: 1.2.1.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
          description: ''
  /api/v1/services/{serviceSlug}/zaaktypen/{zaaktypenZaaktypeUuid}/zaken/{zakenZaakUuid}/documents/{documentUuid}/download:
    get:
      operationId: documentDownload
      description: Download de binaire data van het (ENKELVOUDIG) INFORMATIEOBJECT.
      summary: documentsDownload
      parameters:
      - in: path
        name: documentUuid
        schema:
          type: string
        required: true
      - in: path
        name: serviceSlug
        schema:
          type: string
        required: true
      - in: path
        name: zaaktypenZaaktypeUuid
        schema:
          type: string
        required: true
      - in: path
        name: zakenZaakUuid
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          headers:
            API-version:
              schema:
                type: string
              description: 'Geeft een specifieke API-versie aan in de context van
                een specifieke aanroep. Voorbeeld: 1.2.1.'
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          description: De binaire bestandsinhoud
  /api/v1/services/{serviceSlug}/zaaktypen/{zaaktypenZaaktypeUuid}/zaken/{zakenZaakUuid}/documents/{documentUuid}/edit:
    get:
      operationId: documentEdit
      description: Een document met binaire gegevens bewerken op OneDrive
      summary: documentsEdit
      parameters:
      - in: path
        name: documentUuid
        schema:
          type: string
        required: true
      - in: query
        name: originUrl
        schema:
          type: string
        description: URL to redirect to in case of a renewed authentication flow
      - in: path
        name: serviceSlug
        schema:
          type: string
        required: true
      - in: path
        name: zaaktypenZaaktypeUuid
        schema:
          type: string
        required: true
      - in: path
        name: zakenZaakUuid
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          headers:
            API-version:
              schema:
                type: string
              description: 'Geeft een specifieke API-versie aan in de context van
                een specifieke aanroep. Voorbeeld: 1.2.1.'
          description: Editor URL as a body
        '403':
          headers:
            API-version:
              schema:
                type: string
              description: 'Geeft een specifieke API-versie aan in de context van
                een specifieke aanroep. Voorbeeld: 1.2.1.'
          description: Authentication URL as body
        '423':
          headers:
            API-version:
              schema:
                type: string
              description: 'Geeft een specifieke API-versie aan in de context van
                een specifieke aanroep. Voorbeeld: 1.2.1.'
          description: Empty body, document is locked
  /api/v1/services/{serviceSlug}/zaaktypen/{zaaktypenZaaktypeUuid}/zaken/{zakenZaakUuid}/documents/{documentUuid}/upload:
    get:
      operationId: documentUpload
      description: Een nieuwe versie van een document uploaden naar OpenZaak
      summary: documentsUpload
      parameters:
      - in: path
        name: documentUuid
        schema:
          type: string
        required: true
      - in: path
        name: serviceSlug
        schema:
          type: string
        required: true
      - in: path
        name: zaaktypenZaaktypeUuid
        schema:
          type: string
        required: true
      - in: path
        name: zakenZaakUuid
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          headers:
            API-version:
              schema:
                type: string
              description: 'Geeft een specifieke API-versie aan in de context van
                een specifieke aanroep. Voorbeeld: 1.2.1.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
          description: ''
  /api/v1/services/{serviceSlug}/zaken:
    get:
      operationId: apiV1ServicesZakenList
      description: Exposes Zaak from /services/<zgw-service>/zaaktypen/<zaaktype>/zaken
      summary: serviceZakenList
      parameters:
      - in: query
        name: identificatie__icontains
        schema:
          type: string
        description: De unieke identificatie van de ZAAK (bevat de identificatie de
          gegeven waarden (hoofdletterongevoelig))
      - in: query
        name: omschrijving
        schema:
          type: string
        description: Een korte omschrijving van de ZAAK (bevat de omschrijving de
          gegeven waarden (hoofdletterongevoelig))
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: pageSize
        required: false
        in: query
        description: 'Het aantal resultaten terug te geven per pagina. (default: 100,
          maximum: 500).'
        schema:
          type: integer
      - in: path
        name: serviceSlug
        schema:
          type: string
        required: true
      - in: query
        name: startdatum__gte
        schema:
          type: string
          format: date
        description: De datum waarop met de uitvoering van de zaak is gestart
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          headers:
            API-version:
              schema:
                type: string
              description: 'Geeft een specifieke API-versie aan in de context van
                een specifieke aanroep. Voorbeeld: 1.2.1.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedZaakList'
          description: ''
    post:
      operationId: apiV1ServicesZakenCreate
      description: Exposes Zaak from /services/<zgw-service>/zaaktypen/<zaaktype>/zaken
      summary: serviceZakenCreate
      parameters:
      - in: path
        name: serviceSlug
        schema:
          type: string
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ZaakCreate'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          headers:
            API-version:
              schema:
                type: string
              description: 'Geeft een specifieke API-versie aan in de context van
                een specifieke aanroep. Voorbeeld: 1.2.1.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Zaak'
          description: ''
  /api/v1/services/{serviceSlug}/zaken/{zaakUuid}:
    get:
      operationId: apiV1ServicesZakenRetrieve
      description: Exposes Zaak from /services/<zgw-service>/zaaktypen/<zaaktype>/zaken
      summary: serviceZakenRetrieve
      parameters:
      - in: path
        name: serviceSlug
        schema:
          type: string
        required: true
      - in: path
        name: zaakUuid
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          headers:
            API-version:
              schema:
                type: string
              description: 'Geeft een specifieke API-versie aan in de context van
                een specifieke aanroep. Voorbeeld: 1.2.1.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Zaak'
          description: ''
  /api/v1/services/{slug}:
    get:
      operationId: apiV1ServicesRetrieve
      parameters:
      - in: path
        name: slug
        schema:
          type: string
          title: Service slug
          description: A unique, human-friendly slug to identify this service. Primarily
            useful for cross-instance import/export.
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          headers:
            API-version:
              schema:
                type: string
              description: 'Geeft een specifieke API-versie aan in de context van
                een specifieke aanroep. Voorbeeld: 1.2.1.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
          description: ''
  /oidc/callback/:
    get:
      operationId: oidcCallbackRetrieve
      description: Callback endpoint voor Microsoft OAuth authenticatie.
      summary: Microsoft authentication callback
      tags:
      - oidc
      security:
      - cookieAuth: []
      responses:
        '302':
          headers:
            API-version:
              schema:
                type: string
              description: 'Geeft een specifieke API-versie aan in de context van
                een specifieke aanroep. Voorbeeld: 1.2.1.'
          description: Redirect naar de oorspronkelijke URL na succesvolle authenticatie
        '400':
          headers:
            API-version:
              schema:
                type: string
              description: 'Geeft een specifieke API-versie aan in de context van
                een specifieke aanroep. Voorbeeld: 1.2.1.'
          description: Invalid callback of fout tijdens authenticatie
        '401':
          headers:
            API-version:
              schema:
                type: string
              description: 'Geeft een specifieke API-versie aan in de context van
                een specifieke aanroep. Voorbeeld: 1.2.1.'
          description: Authenticatie mislukt (geen access token)
  /webhook:
    post:
      operationId: webhookCreate
      description: Endpoint webhook che riceve notifiche dal backend document_edit.
      summary: Webhook callback
      tags:
      - webhook
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          headers:
            API-version:
              schema:
                type: string
              description: 'Geeft een specifieke API-versie aan in de context van
                een specifieke aanroep. Voorbeeld: 1.2.1.'
          content:
            text/plain:
              schema:
                type: string
          description: Webhook verwerkt
        '400':
          headers:
            API-version:
              schema:
                type: string
              description: 'Geeft een specifieke API-versie aan in de context van
                een specifieke aanroep. Voorbeeld: 1.2.1.'
          description: Ongeldige payload
components:
  schemas:
    Auth:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
      required:
      - password
      - username
    Document:
      type: object
      properties:
        uuid:
          type: string
          description: Unieke resource identifier (UUID4)
        url:
          type: string
          format: uri
          description: URL-referentie naar dit object. Dit is de unieke identificatie
            en locatie van dit object.
        identificatie:
          type: string
          description: Een binnen een gegeven context ondubbelzinnige referentie naar
            het INFORMATIEOBJECT.
        bronorganisatie:
          type: string
          description: Het RSIN van de Niet-natuurlijk persoon zijnde de organisatie
            die het informatieobject heeft gecreëerd of heeft ontvangen en als eerste
            in een samenwerkingsketen heeft vastgelegd.
        creatiedatum:
          type: string
          format: date
          description: Een datum of een gebeurtenis in de levenscyclus van het INFORMATIEOBJECT.
        titel:
          type: string
          description: De naam waaronder het INFORMATIEOBJECT formeel bekend is.
        auteur:
          type: string
          description: De persoon of organisatie die dit informatie object heeft aangemaakt
        taal:
          type: string
          description: 'Een ISO 639-2/B taalcode waarin de inhoud van het INFORMATIEOBJECT
            is vastgelegd. Voorbeeld: `dut`. Zie: https://www.iso.org/standard/4767.html'
        beginRegistratie:
          type: string
          format: date-time
          description: Een datumtijd in ISO8601 formaat waarop deze versie van het
            INFORMATIEOBJECT is aangemaakt of gewijzigd.
        informatieobjecttype:
          type: string
          description: URL-referentie naar het INFORMATIEOBJECTTYPE (in de Catalogi
            API).
        vertrouwelijkheidaanduiding:
          type: string
          nullable: true
          description: Aanduiding van de mate waarin het INFORMATIEOBJECT voor de
            openbaarheid bestemd is.
        status:
          type: string
          nullable: true
          description: 'Aanduiding van de stand van zaken van een INFORMATIEOBJECT. '
        formaat:
