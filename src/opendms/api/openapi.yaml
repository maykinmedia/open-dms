    Search:
      type: object
      properties:
        query:
          type: string
          default: ''
          description: |-
            Filtering records based on the provided search term. The search is performed across both Documents and Zaken index.This search is applied to the following fields:

            **Documents:**
            - `identificatie`
            - `titel`
            - `bronorganisatie`
            - `beschrijving`
            - `document_data.attachment.content`

            - `zaak_referenties.identificatie`
            - `zaak_referenties.omschrijving`
            - `zaak_referenties.toelichting`
            - `zaak_referenties.status`

            **Zaken:**
            - `identificatie`
            - `omschrijving`
            - `toelichting`
            - `status`

            You can use double quotes for exact matches and `AND`/`OR` syntax for complex queries.
        page:
          type: integer
          default: 1
          description: Page number.
        pageSize:
          type: integer
          default: 10
          description: Number of results per page.
        sort:
          allOf:
          - $ref: '#/components/schemas/SortEnum'
          default: relevance
        creatiedatumVanaf:
          type: string
          format: date
          nullable: true
          description: Filter documents created on or after this date.
        creatiedatumTotEnMet:
          type: string
          format: date
          nullable: true
          description: Filter documents created on or before this date.
    SearchResponse:
      type: object
      properties:
        count:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/SearchResult'
      required:
      - count
      - results
    SearchResult:
      oneOf:
      - $ref: '#/components/schemas/SearchResultDocument'
      - $ref: '#/components/schemas/SearchResultZaak'
      discriminator:
        propertyName: type
        mapping:
          document: '#/components/schemas/SearchResultDocument'
          zaak: '#/components/schemas/SearchResultZaak'
    SearchResultDocument:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/SearchResultDocumentTypeEnum'
        data:
          $ref: '#/components/schemas/ESDocument'
      required:
      - data
      - type
    SearchResultDocumentTypeEnum:
      enum:
      - document
      type: string
    SearchResultZaak:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/SearchResultZaakTypeEnum'
        data:
          $ref: '#/components/schemas/ESZaak'
      required:
      - data
      - type
    SearchResultZaakTypeEnum:
